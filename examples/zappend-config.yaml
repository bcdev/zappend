logging:
  formatters:
    normal:
      format: '%(asctime)s %(levelname)s %(message)s'
      style: '%'
  handlers:
    console:
      class: logging.StreamHandler
      formatter: normal
  loggers:
    notebook:
      handlers:
      - console
      level: INFO
    zappend:
      handlers:
      - console
      level: INFO
  version: 1
target_dir: outputs/target.zarr
variables:
  time:
    encoding:
      chunks:
      - 100
